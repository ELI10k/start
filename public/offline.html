<!doctype html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#FFFFFF">
<title>אין חיבור · START</title>
<!--
  The offline fallback, and deliberately the only page the worker keeps.

  Everything is inline - the mark is an SVG, the palette is copied from
  globals.css - so this renders with nothing else in the cache. That is the whole
  reason it can be trusted: it carries no user data, needs no user data, and
  cannot go stale in a way that shows one person's numbers to another.

  It never signs anyone out. The session cookie is untouched; the page it came
  from is still there once the network is.
-->
<style>
  :root {
    --surface: #FFFFFF;
    --ink: #0B0B0B;
    --ink-muted: rgba(11, 11, 11, .58);
    --line: rgba(11, 11, 11, .10);
    --green: #16A34A;
    --green-press: #15803D;
    --green-tint: #ECFDF3;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; height: 100%; }
  body {
    display: grid;
    place-items: center;
    padding: max(1.5rem, env(safe-area-inset-top)) max(1.5rem, env(safe-area-inset-right))
             max(1.5rem, env(safe-area-inset-bottom)) max(1.5rem, env(safe-area-inset-left));
    background: var(--surface);
    color: var(--ink);
    font-family: "Assistant", system-ui, -apple-system, "Segoe UI", sans-serif;
    text-align: center;
    /* Nothing may push this sideways at 320px, let alone 375. */
    overflow-x: hidden;
  }
  main { width: 100%; max-width: 26rem; }
  .mark {
    display: inline-grid;
    place-items: center;
    width: 4.5rem; height: 4.5rem;
    border-radius: 1.25rem;
    background: var(--green-tint);
    color: var(--green);
  }
  .wordmark {
    margin-top: 1.25rem;
    font-size: 1.0625rem; font-weight: 800; letter-spacing: .2em;
    color: var(--green);
  }
  h1 { margin: .75rem 0 0; font-size: 1.75rem; font-weight: 800; line-height: 1.25; }
  p { margin: .75rem 0 0; color: var(--ink-muted); font-size: .9375rem; line-height: 1.6; }
  button {
    margin-top: 1.75rem;
    display: inline-flex; align-items: center; justify-content: center; gap: .5rem;
    width: 100%; min-height: 3.25rem; padding: 0 1.5rem;
    border: 0; border-radius: 1rem;
    background: var(--green); color: #FFFFFF;
    font: inherit; font-weight: 800; font-size: 1rem;
    cursor: pointer;
  }
  button:active { background: var(--green-press); }
  button[disabled] { opacity: .55; cursor: progress; }
  .status { margin-top: .875rem; min-height: 1.25rem; font-size: .8125rem; color: var(--ink-muted); }
  .note {
    margin-top: 1.75rem; padding-top: 1.25rem;
    border-top: 1px solid var(--line);
    font-size: .8125rem; color: var(--ink-muted);
  }
</style>
</head>
<body>
<main>
  <span class="mark" aria-hidden="true">
    <svg width="34" height="34" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <path d="M1 1l22 22"/><path d="M16.72 11.06A10.94 10.94 0 0 1 19 12.55"/>
      <path d="M5 12.55a10.94 10.94 0 0 1 5.17-2.39"/><path d="M10.71 5.05A16 16 0 0 1 22.58 9"/>
      <path d="M1.42 9a15.91 15.91 0 0 1 4.7-2.88"/><path d="M8.53 16.11a6 6 0 0 1 6.95 0"/>
      <line x1="12" y1="20" x2="12.01" y2="20"/>
    </svg>
  </span>
  <p class="wordmark">START</p>
  <h1>אין חיבור לאינטרנט</h1>
  <p>לא הצלחנו להגיע לשרת. הנתונים שלך שמורים ולא אבדו — ברגע שהחיבור יחזור אפשר להמשיך בדיוק מאותה נקודה.</p>

  <button type="button" id="retry">נסה שוב</button>
  <p class="status" id="status" role="status" aria-live="polite"></p>

  <p class="note">START דורש חיבור לאינטרנט. המסך הזה מוצג במקום שגיאת דפדפן, ואינו מציג נתונים שמורים.</p>
</main>

<script>
  // Everything is scoped. A top-level `var status` would land on window.status,
  // which is a legacy Window property that coerces whatever it is given to a
  // string - so the assignment succeeds, the element is never touched, and the
  // message silently never appears.
  (function () {
    // The worker answers the failed navigation with this page, so the address bar
    // still holds the URL the coach was heading for. Reloading returns them to
    // that screen rather than to the home screen.
    var button = document.getElementById("retry");
    var line = document.getElementById("status");
    var checking = false;

    function attempt() {
      if (checking) return;
      checking = true;
      button.disabled = true;
      line.textContent = "בודקים חיבור…";
      // A real request rather than navigator.onLine, which reports the radio and
      // not whether anything is actually reachable.
      fetch("/manifest.webmanifest", { method: "HEAD", cache: "no-store" })
        .then(function () { location.reload(); })
        .catch(function () {
          checking = false;
          button.disabled = false;
          line.textContent = "עדיין אין חיבור. אפשר לנסות שוב בעוד רגע.";
        });
    }

    button.addEventListener("click", attempt);
    // Coming back into range is the common case; take it without a tap.
    window.addEventListener("online", attempt);
  })();
</script>
</body>
</html>
