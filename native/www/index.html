<!doctype html>
<html lang="he" dir="rtl">

    <style>
      :root { color-scheme: light; }
      body {
        margin: 0;
        min-height: 100dvh;
        display: grid;
        place-items: center;
        padding: max(2rem, env(safe-area-inset-top)) 1.5rem max(2rem, env(safe-area-inset-bottom));

        font-family: system-ui, -apple-system, "Segoe UI", sans-serif;

      }
      strong { display: block; font-size: 1.75rem; font-weight: 900; letter-spacing: .2em; color: #16a34a; }

  <body>
    <!--
      This page is only ever seen when the device cannot reach the START server
      at all. Everything else is served by the deployed app; see
      capacitor.config.ts for why the shell loads it rather than bundling it.
    -->

      <strong>START</strong>
